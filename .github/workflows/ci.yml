name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cliente — lint y build
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm run build

      - name: API — build y smoke test
        run: |
          dotnet build src/CaballeroNegro.Api -c Release --nologo
          dotnet run --project src/CaballeroNegro.Api -c Release --no-build --urls http://localhost:5080 &
          for i in $(seq 1 20); do curl -sf localhost:5080/api/health && break; sleep 1; done
          curl -sf localhost:5080/api/menu | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['categories']) == 9, d"
          curl -sf localhost:5080/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:5080/api/chat -H 'content-type: application/json' -d '{"messages":[{"role":"user","content":"hola"}]}')" = "503"
